<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File Intelligence</title>
<style>
:root{
  --bg:#0d1117; --panel:#151b23; --panel-2:#1c232d; --line:#293241;
  --ink:#e6edf3; --ink-dim:#8b98a9; --ink-faint:#5c6773;
  --accent:#4c9aff; --good:#3fb950; --warn:#d29922; --bad:#f85149; --violet:#a371f7;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme="light"]{
  --bg:#f6f8fa; --panel:#fff; --panel-2:#f0f3f6; --line:#d5dbe2;
  --ink:#1f2328; --ink-dim:#5b6774; --ink-faint:#8c98a4;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);
  display:grid;grid-template-columns:212px 1fr;min-height:100vh}

/* ---- nav ---- */
nav{background:var(--panel);border-right:1px solid var(--line);padding:16px 0;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 16px 14px;font-weight:600;letter-spacing:-.02em;font-size:15px}
.brand span{color:var(--accent)}
.navsec{padding:14px 16px 6px;font-size:10px;text-transform:uppercase;
  letter-spacing:.09em;color:var(--ink-faint)}
nav button{display:block;width:100%;text-align:left;padding:7px 16px;background:none;
  border:0;border-left:2px solid transparent;color:var(--ink-dim);font:inherit;cursor:pointer}
nav button:hover{background:var(--panel-2);color:var(--ink)}
nav button.on{color:var(--ink);border-left-color:var(--accent);background:var(--panel-2)}
nav .lensbtn{font-size:13px;padding-left:16px}
nav .lensbtn::before{content:"◆ ";color:var(--violet);font-size:9px}

/* ---- layout ---- */
main{padding:22px 26px 60px;max-width:1500px;overflow-x:hidden}
h1{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-bottom:2px}
.sub{color:var(--ink-dim);font-size:12.5px;margin-bottom:20px}
h2{font-size:13px;font-weight:600;margin:26px 0 10px;color:var(--ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}

/* ---- metric tiles ---- */
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.tile .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint)}
.tile .v{font-size:25px;font-weight:600;letter-spacing:-.03em;margin-top:5px;
  font-variant-numeric:tabular-nums}
.tile .n{font-size:11.5px;color:var(--ink-dim);margin-top:3px}
.v.good{color:var(--good)} .v.warn{color:var(--warn)} .v.bad{color:var(--bad)}

/* ---- tables ---- */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:600;color:var(--ink-faint);font-size:10.5px;
  text-transform:uppercase;letter-spacing:.06em;padding:7px 9px;
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:var(--panel-2);cursor:pointer}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.path{font-family:var(--mono);font-size:11.5px;word-break:break-all;max-width:520px}

/* ---- chips ---- */
.chip{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10.5px;
  background:var(--panel-2);color:var(--ink-dim);border:1px solid var(--line);white-space:nowrap}
.chip.user{color:var(--good);border-color:#2a5c33}
.chip.cache{color:var(--ink-faint)}
.chip.backup{color:var(--warn);border-color:#5c4a1a}
.chip.system{color:var(--accent);border-color:#22456e}
.chip.master{color:var(--good);border-color:#2a5c33}
.chip.duplicate{color:var(--bad);border-color:#6e2a26}

/* ---- controls ---- */
button.btn{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  padding:6px 12px;border-radius:6px;font:inherit;font-size:12.5px;cursor:pointer}
button.btn:hover{border-color:var(--accent)}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:600}
button.btn.danger{color:var(--bad);border-color:#6e2a26}
input,select,textarea{background:var(--bg);border:1px solid var(--line);color:var(--ink);
  padding:6px 9px;border-radius:6px;font:inherit;font-size:12.5px;width:100%}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent)}
label.fl{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-faint);margin-bottom:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---- lens builder ---- */
.cond{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;
  padding:9px;margin-bottom:7px;display:grid;
  grid-template-columns:1.5fr 1.1fr 1.5fr auto;gap:7px;align-items:center}
.sqlbox{font-family:var(--mono);font-size:11.5px;background:var(--bg);
  border:1px solid var(--line);border-radius:7px;padding:11px;white-space:pre-wrap;
  color:var(--ink-dim);max-height:190px;overflow:auto}
.err{color:var(--bad);font-size:12px;font-family:var(--mono);
  background:#2b1211;border:1px solid #6e2a26;border-radius:7px;padding:9px}
:root[data-theme="light"] .err{background:#ffeceb}

/* ---- drawer ---- */
.drawer{position:fixed;top:0;right:0;width:min(620px,94vw);height:100vh;
  background:var(--panel);border-left:1px solid var(--line);padding:20px;
  overflow-y:auto;transform:translateX(100%);transition:transform .18s ease;z-index:50;
  box-shadow:-14px 0 40px rgba(0,0,0,.32)}
.drawer.open{transform:none}
.kv{display:grid;grid-template-columns:150px 1fr;gap:5px 12px;font-size:12.5px;
  margin-bottom:16px}
.kv dt{color:var(--ink-faint);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.kv dd{font-family:var(--mono);font-size:11.5px;word-break:break-all}

/* ---- misc ---- */
.bar{height:7px;background:var(--panel-2);border-radius:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.empty{color:var(--ink-faint);font-size:12.5px;padding:22px;text-align:center}
.hide{display:none!important}
svg text{font:10px var(--sans);fill:var(--ink-dim)}
@media(max-width:860px){body{grid-template-columns:1fr}nav{position:static;height:auto}}
</style>
</head>
<body>

<nav>
  <div class="brand">File <span>Intelligence</span></div>
  <div class="navsec">Views</div>
  <button data-view="overview" class="on">Command Center</button>
  <button data-view="investigator">Investigator</button>
  <button data-view="cleanup">Cleanup Crew</button>
  <button data-view="projects">Projects</button>
  <button data-view="ajalugu">Ajalugu</button>
  <div class="navsec">Build</div>
  <button data-view="builder">Lens Builder</button>
  <div class="navsec" id="lensHead">Saved Lenses</div>
  <div id="lensList"></div>
  <div class="navsec">&nbsp;</div>
  <button id="themeToggle">Toggle theme</button>
</nav>

<main>
  <div id="view"></div>
</main>

<div class="drawer" id="drawer"></div>

<script>
'use strict';
const API = '';
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,a={},...kids)=>{const n=document.createElement(t);
  for(const[k,v]of Object.entries(a)){
    if(k==='class')n.className=v; else if(k==='html')n.innerHTML=v;
    else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);
    else if(v!=null)n.setAttribute(k,v);}
  for(const kid of kids.flat()){if(kid==null)continue;
    n.append(kid.nodeType?kid:document.createTextNode(kid));}
  return n;};

const bytes = n => {
  if(n==null) return '–';
  n = Number(n); const u=['B','KB','MB','GB','TB']; let i=0;
  while(Math.abs(n)>=1024 && i<u.length-1){n/=1024;i++;}
  return (i===0?n:n.toFixed(1))+' '+u[i];
};
const num = n => n==null?'–':Number(n).toLocaleString();
const short = p => p && p.length>72 ? '…'+p.slice(-70) : (p||'');

async function api(path, opts){
  const res = await fetch(API+path, {headers:{'content-type':'application/json'}, ...opts});
  if(!res.ok){
    let msg = res.statusText;
    try{ msg = (await res.json()).detail || msg; }catch(e){}
    throw new Error(msg);
  }
  return res.headers.get('content-type')?.includes('json') ? res.json() : res.text();
}

/* ===================== Command Center ===================== */
async function viewOverview(root){
  root.append(el('h1',{},'Command Center'), el('div',{class:'sub'},'Loading…'));
  const d = await api('/api/overview');
  root.innerHTML='';
  const s = d.scan||{}, t = d.totals||{}, dup = d.duplicates||{};
  const dupPct = t.bytes ? (dup.reclaimable/t.bytes*100).toFixed(1) : 0;

  root.append(
    el('h1',{},'Command Center'),
    el('div',{class:'sub'}, s.started ? `Last scan ${s.started.slice(0,19).replace('T',' ')} · ${(s.duration_seconds||0).toFixed(0)}s` : 'No scans yet — run scripts/scan.py'),
    el('div',{class:'grid g4'},
      tile('Files on disk', num(t.files)),
      tile('Total size', bytes(t.bytes)),
      tile('Reclaimable', bytes(dup.reclaimable), `${dupPct}% of disk · ${num(dup.groups)} groups`, dup.reclaimable>0?'warn':''),
      tile('Changed last scan', num(s.changed_files), `${num(s.new_files)} new · ${num(s.deleted_files)} gone`),
      t.secret_files ? tile('Files with secrets', num(t.secret_files), 'credential patterns', 'bad') : null
    ),
    el('div',{class:'grid g2',style:'margin-top:14px'},
      el('div',{class:'panel'}, el('h2',{style:'margin-top:0'},'Disk by category'), donut(d.by_category)),
      el('div',{class:'panel'}, el('h2',{style:'margin-top:0'},'Disk by scope'), scopeBars(d.by_scope))
    ),
    el('div',{class:'panel',style:'margin-top:14px'},
      el('h2',{style:'margin-top:0'},'Inventory over time'), timeline(d.timeline)),
    el('div',{class:'panel',style:'margin-top:14px'},
      el('h2',{style:'margin-top:0'},'Largest files (excluding system scope)'),
      el('div',{class:'scroll'}, table(
        ['Size','Scope','Dup','Path'],
        d.largest.map(r=>[
          {c:'num',v:bytes(r.size_bytes)},
          {v:chip(r.system_scope)},
          {v:r.duplicate_status?chip(r.duplicate_status):''},
          {c:'path',v:r.path}
        ]),
        d.largest.map(r=>()=>openDrawer(r.path))
      ))
    )
  );
}

function tile(k,v,n,cls){
  return el('div',{class:'tile'}, el('div',{class:'k'},k),
    el('div',{class:'v '+(cls||'')},v), n?el('div',{class:'n'},n):null);
}

const PALETTE = ['#4c9aff','#a371f7','#3fb950','#d29922','#f85149','#39c5cf',
                 '#db6d28','#8b98a9','#6e7681','#456'];

function donut(data){
  const top = data.filter(d=>d.bytes>0).slice(0,9);
  const total = top.reduce((a,b)=>a+b.bytes,0) || 1;
  const R=62, C=2*Math.PI*R;
  let off=0;
  const rings = top.map((d,i)=>{
    const frac = d.bytes/total;
    // SVG elements need createElementNS -- el() builds HTML-namespace nodes,
    // which render as nothing inside an <svg>.
    const seg = document.createElementNS('http://www.w3.org/2000/svg','circle');
    seg.setAttribute('cx',80); seg.setAttribute('cy',80); seg.setAttribute('r',R);
    seg.setAttribute('fill','none'); seg.setAttribute('stroke',PALETTE[i%PALETTE.length]);
    seg.setAttribute('stroke-width',22);
    seg.setAttribute('stroke-dasharray',`${frac*C} ${C}`);
    seg.setAttribute('stroke-dashoffset',-off*C);
    seg.setAttribute('transform','rotate(-90 80 80)');
    seg.append(svgTitle(`${d.category}: ${bytes(d.bytes)}`));
    off += frac;
    return seg;
  });
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 160 160');
  svg.setAttribute('width','160'); svg.setAttribute('height','160');
  rings.forEach(r=>svg.append(r));
  const legend = el('div',{style:'flex:1;min-width:150px'},
    top.map((d,i)=>el('div',{class:'row',style:'justify-content:space-between;font-size:12px;padding:1.5px 0'},
      el('span',{class:'row',style:'gap:6px'},
        el('span',{style:`width:9px;height:9px;border-radius:2px;display:inline-block;background:${PALETTE[i%PALETTE.length]}`}),
        d.category||'unknown'),
      el('span',{style:'color:var(--ink-dim);font-variant-numeric:tabular-nums'},bytes(d.bytes))
    )));
  return el('div',{class:'row',style:'gap:18px;align-items:center'}, svg, legend);
}

function svgTitle(text){
  const t = document.createElementNS('http://www.w3.org/2000/svg','title');
  t.textContent = text; return t;
}

function scopeBars(data){
  const max = Math.max(...data.map(d=>d.bytes||0), 1);
  const colors = {user:'var(--good)',cache:'var(--ink-faint)',backup:'var(--warn)',system:'var(--accent)'};
  return el('div',{},data.map(d=>el('div',{style:'margin-bottom:11px'},
    el('div',{class:'row',style:'justify-content:space-between;font-size:12px;margin-bottom:4px'},
      el('span',{},chip(d.scope)),
      el('span',{style:'color:var(--ink-dim);font-variant-numeric:tabular-nums'},
        `${bytes(d.bytes)} · ${num(d.files)} files`)),
    el('div',{class:'bar'}, el('i',{style:`width:${(d.bytes/max*100).toFixed(1)}%;background:${colors[d.scope]||'var(--accent)'}`}))
  )));
}

function timeline(rows){
  if(!rows || rows.length<2) return el('div',{class:'empty'},'Need at least two scans to draw a trend.');
  const W=900,H=150,P=34;
  const xs = rows.map((_,i)=>P+i*(W-2*P)/(rows.length-1));
  const maxB = Math.max(...rows.map(r=>r.total_size_bytes||0),1);
  const pts = rows.map((r,i)=>`${xs[i]},${H-P-(r.total_size_bytes/maxB)*(H-2*P)}`).join(' ');
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('width','100%');
  svg.setAttribute('preserveAspectRatio','none'); svg.style.height='150px';
  const poly = document.createElementNS('http://www.w3.org/2000/svg','polyline');
  poly.setAttribute('points',pts); poly.setAttribute('fill','none');
  poly.setAttribute('stroke','var(--accent)'); poly.setAttribute('stroke-width','2');
  svg.append(poly);
  rows.forEach((r,i)=>{
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',xs[i]); c.setAttribute('cy',H-P-(r.total_size_bytes/maxB)*(H-2*P));
    c.setAttribute('r',3); c.setAttribute('fill','var(--accent)');
    c.append(svgTitle(`${(r.started||'').slice(0,16)}\n${bytes(r.total_size_bytes)}\n${num(r.total_files)} files`));
    svg.append(c);
  });
  return el('div',{}, svg,
    el('div',{class:'row',style:'justify-content:space-between;font-size:11px;color:var(--ink-faint)'},
      el('span',{},(rows[0].started||'').slice(0,10)),
      el('span',{},`peak ${bytes(maxB)}`),
      el('span',{},(rows[rows.length-1].started||'').slice(0,10))));
}

/* ===================== Investigator ===================== */
const INV = {event:'', scope:'', days:14, q:'', page:0};

async function viewInvestigator(root){
  root.append(el('h1',{},'OSINT Investigator'),
    el('div',{class:'sub'},'Append-only event log. Every creation, modification and disappearance the scanner recorded.'));

  const ctl = el('div',{class:'panel'}, el('div',{class:'grid',style:'grid-template-columns:repeat(auto-fit,minmax(140px,1fr))'},
    field('Event', select(['','created','modified','resized','missing'], INV.event, v=>{INV.event=v;INV.page=0;load();})),
    field('Scope', select(['','user','cache','backup','system'], INV.scope, v=>{INV.scope=v;INV.page=0;load();})),
    field('Window', select([['1','last 24h'],['7','last 7 days'],['14','last 14 days'],['90','last 90 days'],['3650','all time']], String(INV.days), v=>{INV.days=+v;INV.page=0;load();})),
    field('Path contains', el('input',{placeholder:'ai-mailbox', value:INV.q,
      oninput:debounce(e=>{INV.q=e.target.value;INV.page=0;load();},320)}))
  ));
  const out = el('div',{style:'margin-top:14px'});
  root.append(ctl,out);

  async function load(){
    out.innerHTML=''; out.append(el('div',{class:'empty'},'Querying…'));
    const where = {all:[{field:'timestamp',op:'gte',value:{'$daysAgoIso':INV.days}}]};
    if(INV.event) where.all.push({field:'event',op:'eq',value:INV.event});
    if(INV.scope) where.all.push({field:'system_scope',op:'eq',value:INV.scope});
    if(INV.q) where.all.push({field:'path',op:'contains',value:INV.q});
    try{
      const r = await api('/api/query',{method:'POST',body:JSON.stringify({
        source:'v_recent_changes',
        columns:['timestamp','event','path','size_bytes','category','system_scope','project_name','current_status'],
        where, order_by:[{field:'timestamp',dir:'desc'}], limit:100, offset:INV.page*100
      })});
      out.innerHTML='';
      if(!r.rows.length){out.append(el('div',{class:'panel'},el('div',{class:'empty'},'No events match. Widen the window, or run a scan.')));return;}
      out.append(el('div',{class:'panel'},
        el('div',{class:'scroll'}, table(
          ['When','Event','Size','Scope','Project','Path'],
          r.rows.map(x=>[
            {v:(x.timestamp||'').slice(0,19).replace('T',' ')},
            {v:chip(x.event)},
            {c:'num',v:bytes(x.size_bytes)},
            {v:chip(x.system_scope)},
            {v:x.project_name||''},
            {c:'path',v:short(x.path)}
          ]),
          r.rows.map(x=>()=>openDrawer(x.path))
        )),
        el('div',{class:'row',style:'margin-top:11px;justify-content:space-between'},
          el('span',{style:'color:var(--ink-dim);font-size:12px'},
            `${r.row_count} events · page ${INV.page+1}`),
          el('div',{class:'row'},
            el('button',{class:'btn',onclick:()=>{if(INV.page>0){INV.page--;load();}}},'‹ Prev'),
            el('button',{class:'btn',onclick:()=>{if(r.truncated){INV.page++;load();}}},'Next ›')))
      ));
    }catch(e){ out.innerHTML=''; out.append(el('div',{class:'err'},e.message)); }
  }
  load();
}

/* ===================== Drawer ===================== */
async function openDrawer(path){
  const d = $('#drawer');
  d.classList.add('open');
  d.innerHTML=''; d.append(el('div',{class:'empty'},'Loading…'));
  try{
    const r = await api('/api/file?path='+encodeURIComponent(path));
    const f = r.file;
    d.innerHTML='';
    d.append(
      el('div',{class:'row',style:'justify-content:space-between;margin-bottom:14px'},
        el('h1',{style:'font-size:15px'},f.filename),
        el('button',{class:'btn',onclick:()=>d.classList.remove('open')},'Close')),
      el('div',{style:'font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);word-break:break-all;margin-bottom:16px'},f.path),
      el('h2',{},'Identity'),
      kv({'BLAKE3':f.blake3, 'Previous hash':f.old_blake3, 'Size':bytes(f.size_bytes)+` (${num(f.size_bytes)} B)`,
          'MIME':f.mime_type, 'Category':f.category, 'Language':f.language,
          'Permissions':f.permissions, 'Inode':f.inode, 'Owner':`${f.owner_name||'?'}:${f.group_name||'?'}`}),
      el('h2',{},'Lifecycle'),
      kv({'Status':f.status, 'First seen':f.first_seen, 'Times seen':f.seen_count,
          'Last scan':f.last_seen_scan, 'Changed in scan':f.changed_scan,
          'Modified':f.mtime?new Date(f.mtime*1000).toISOString().slice(0,19).replace('T',' '):null,
          'Scope':f.system_scope}),
      f.project_name ? el('h2',{},'Project') : null,
      f.project_name ? kv({'Name':f.project_name,'Type':f.project_type,'Root':f.project_root,
          'Git':f.git_repo?'yes':'no','Branch':f.git_branch}) : null,
      f.contains_secrets ? el('div',{class:'err',style:'margin-bottom:16px'},
        `Contains credential patterns: ${f.secret_types}`) : null,
      el('h2',{},`History (${r.history.length} events)`),
      r.history.length ? el('div',{class:'scroll'}, table(['When','Event','From','To'],
        r.history.map(h=>[{v:(h.timestamp||'').slice(0,19).replace('T',' ')},{v:chip(h.event)},
          {v:(h.old_value||'').slice(0,12)},{v:(h.new_value||'').slice(0,12)}]))
      ) : el('div',{class:'empty'},'No recorded events.'),
      el('h2',{},`Identical copies (${r.identical_copies.length})`),
      r.identical_copies.length ? el('div',{class:'scroll'}, table(['Role','Score','Path'],
        r.identical_copies.map(c=>[{v:chip(c.role)},{c:'num',v:c.score??''},{c:'path',v:c.path}]),
        r.identical_copies.map(c=>()=>openDrawer(c.path))
      )) : el('div',{class:'empty'},'This content is unique on disk.'),
      r.tags.length ? el('h2',{},'Tags') : null,
      r.tags.length ? el('div',{class:'row'},r.tags.map(t=>chip(t.tag))) : null
    );
  }catch(e){ d.innerHTML=''; d.append(el('div',{class:'err'},e.message),
    el('button',{class:'btn',style:'margin-top:11px',onclick:()=>d.classList.remove('open')},'Close')); }
}
function kv(obj){
  const dl = el('dl',{class:'kv'});
  for(const [k,v] of Object.entries(obj)){
    if(v==null||v==='') continue;
    dl.append(el('dt',{},k), el('dd',{},String(v)));
  }
  return dl;
}

/* ===================== Cleanup ===================== */
async function viewCleanup(root){
  root.append(el('h1',{},'Cleanup Crew'),
    el('div',{class:'sub'},'Ranked by reclaimable bytes — what deleting the duplicates actually frees, with hardlinks and the master copy excluded.'));
  const out = el('div',{});
  root.append(out);
  out.append(el('div',{class:'empty'},'Loading…'));

  const r = await api('/api/query',{method:'POST',body:JSON.stringify({
    source:'v_duplicate_leaderboard',
    columns:['group_id','copies','distinct_inodes','duplicate_type','reclaimable_bytes',
             'unit_bytes','master_path','category','master_scope'],
    where:{field:'reclaimable_bytes',op:'gt',value:0},
    order_by:[{field:'reclaimable_bytes',dir:'desc'}], limit:60
  })});
  out.innerHTML='';
  if(!r.rows.length){
    out.append(el('div',{class:'panel'},el('div',{class:'empty'},
      'No duplicate groups. Run scripts/process_duplicates.py.')));
    return;
  }
  const total = r.rows.reduce((a,b)=>a+(b.reclaimable_bytes||0),0);
  out.append(
    el('div',{class:'grid g4'},
      tile('Top 60 groups reclaim', bytes(total), null, 'warn'),
      tile('Largest group', bytes(r.rows[0].reclaimable_bytes), `${r.rows[0].copies} copies`)),
    el('div',{class:'panel',style:'margin-top:14px'},
      el('div',{class:'row',style:'justify-content:space-between;margin-bottom:11px'},
        el('h2',{style:'margin:0'},'Duplicate leaderboard'),
        el('button',{class:'btn',onclick:genPlan},'Generate cleanup script')),
      el('div',{class:'scroll'}, table(
        ['Reclaims','Copies','Type','Unit','Scope','Master (kept)'],
        r.rows.map(x=>[
          {c:'num',v:bytes(x.reclaimable_bytes)},
          {c:'num',v:`${x.copies}${x.distinct_inodes<x.copies?` (${x.distinct_inodes} real)`:''}`},
          {v:chip(x.duplicate_type)},
          {c:'num',v:bytes(x.unit_bytes)},
          {v:chip(x.master_scope)},
          {c:'path',v:short(x.master_path)}
        ]),
        r.rows.map(x=>()=>expandGroup(x.group_id))
      ))),
    el('div',{id:'planOut',style:'margin-top:14px'})
  );

  async function genPlan(){
    const box = $('#planOut'); box.innerHTML='';
    box.append(el('div',{class:'empty'},'Generating…'));
    const script = await api('/api/cleanup/plan',{method:'POST',body:JSON.stringify({
      min_reclaimable: 10*1024*1024, max_groups: 300, scopes:['cache','backup']
    })});
    box.innerHTML='';
    box.append(el('div',{class:'panel'},
      el('div',{class:'row',style:'justify-content:space-between;margin-bottom:9px'},
        el('h2',{style:'margin:0'},'Cleanup script — review before running'),
        el('button',{class:'btn primary',onclick:()=>{
          const b=new Blob([script],{type:'text/x-shellscript'});
          const a=el('a',{href:URL.createObjectURL(b),download:'fi_cleanup.sh'});
          document.body.append(a); a.click(); a.remove();
        }},'Download .sh')),
      el('div',{class:'sub'},'Dry-run by default. Each deletion re-checks the file\'s BLAKE3 first, so anything that changed since the scan is skipped instead of destroyed.'),
      el('div',{class:'sqlbox',style:'max-height:340px'},script)));
  }
}

/* ===================== Lens Builder ===================== */
const B = {source:'v_live_files', conds:[], junction:'all', groupBy:'', agg:'', aggField:'',
           orderBy:'', orderDir:'desc', limit:100, columns:[]};
let SOURCES = [];

async function viewBuilder(root){
  if(!SOURCES.length) SOURCES = (await api('/api/sources')).sources;
  const src = () => SOURCES.find(s=>s.name===B.source) || {fields:[]};

  root.append(el('h1',{},'Lens Builder'),
    el('div',{class:'sub'},'Pick what you monitor, stack the logic you care about, and save it as a button. Every lens compiles to parameterised SQL — shown below, so nothing is hidden from you.'));

  const body = el('div',{});
  root.append(body);

  function render(){
    body.innerHTML='';
    const fields = src().fields.map(f=>f.name);

    body.append(el('div',{class:'panel'},
      el('div',{class:'grid',style:'grid-template-columns:2fr 1fr 1fr;gap:11px'},
        field('Source (what you monitor)', select(SOURCES.map(s=>[s.name,`${s.name} · ${s.field_count} fields`]), B.source, v=>{B.source=v;B.conds=[];B.groupBy='';B.orderBy='';B.columns=[];render();})),
        field('Combine conditions with', select([['all','ALL must match (AND)'],['any','ANY may match (OR)']], B.junction, v=>{B.junction=v;render();})),
        field('Row limit', el('input',{type:'number',value:B.limit,min:1,max:5000,
          onchange:e=>{B.limit=+e.target.value;render();}}))),

      el('h2',{},'Logic'),
      el('div',{}, B.conds.map((c,i)=>el('div',{class:'cond'},
        select(fields, c.field, v=>{c.field=v;render();}),
        select(Object.keys(OPS), c.op, v=>{c.op=v;render();}),
        OPS[c.op].nullary ? el('span',{style:'color:var(--ink-faint);font-size:12px'},'—')
          : el('input',{value:c.value??'',placeholder:OPS[c.op].hint||'value',
              oninput:e=>{c.value=e.target.value;}}),
        el('button',{class:'btn danger',onclick:()=>{B.conds.splice(i,1);render();}},'×')
      ))),
      el('button',{class:'btn',onclick:()=>{B.conds.push({field:fields[0],op:'eq',value:''});render();}},'+ Add condition'),

      el('h2',{},'Shape the output'),
      el('div',{class:'grid',style:'grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px'},
        field('Group by', select([''].concat(fields), B.groupBy, v=>{B.groupBy=v;render();})),
        field('Aggregate', select(['','count','sum','avg','min','max','count_distinct'], B.agg, v=>{B.agg=v;render();})),
        field('Aggregate field', select([''].concat(fields), B.aggField, v=>{B.aggField=v;render();})),
        field('Sort by', select([''].concat(fields).concat(B.agg?['value']:[]), B.orderBy, v=>{B.orderBy=v;render();})),
        field('Direction', select([['desc','descending'],['asc','ascending']], B.orderDir, v=>{B.orderDir=v;render();}))),

      el('div',{class:'row',style:'margin-top:16px'},
        el('button',{class:'btn primary',onclick:run},'Run lens'),
        el('button',{class:'btn',onclick:explain},'Show SQL + plan'),
        el('button',{class:'btn',onclick:save},'Save as button'),
        el('button',{class:'btn',onclick:saveRule},'Save as tagging rule'))
    ));
    body.append(el('div',{id:'lensOut',style:'margin-top:14px'}));
  }

  function buildSpec(){
    const spec = {source:B.source, limit:B.limit};
    const conds = B.conds.filter(c=>c.field).map(c=>{
      const o = {field:c.field, op:c.op};
      if(!OPS[c.op].nullary){
        let v = c.value;
        if(OPS[c.op].list) v = String(v).split(',').map(s=>s.trim()).filter(Boolean);
        else if(/^-?\d+(\.\d+)?$/.test(String(v))) v = Number(v);
        else if(/^\{.*\}$/.test(String(v))) { try{ v = JSON.parse(v); }catch(e){} }
        o.value = v;
      }
      return o;
    });
    if(conds.length) spec.where = conds.length===1 ? conds[0] : {[B.junction]:conds};
    if(B.groupBy){
      spec.group_by = [B.groupBy];
      spec.aggregates = [B.agg
        ? {fn:B.agg, field:B.agg==='count'?undefined:(B.aggField||undefined), as:'value'}
        : {fn:'count', as:'value'}];
    }
    if(B.orderBy) spec.order_by = [{field:B.orderBy, dir:B.orderDir}];
    return spec;
  }

  async function run(){
    const box = $('#lensOut'); box.innerHTML=''; box.append(el('div',{class:'empty'},'Running…'));
    try{
      const r = await api('/api/query',{method:'POST',body:JSON.stringify(buildSpec())});
      box.innerHTML='';
      box.append(el('div',{class:'panel'},
        el('div',{class:'row',style:'justify-content:space-between;margin-bottom:11px'},
          el('h2',{style:'margin:0'},`${r.row_count} rows${r.truncated?' (truncated at limit)':''}`),
          el('button',{class:'btn',onclick:()=>downloadCSV(r)},'Export CSV')),
        r.rows.length ? el('div',{class:'scroll',style:'max-height:520px'}, table(
          r.columns,
          r.rows.map(row=>r.columns.map(c=>{
            const v = row[c];
            if(/bytes|size/.test(c) && typeof v==='number') return {c:'num',v:bytes(v)};
            if(typeof v==='number') return {c:'num',v:num(v)};
            if(c==='path'||c==='source_path'||c==='master_path') return {c:'path',v:short(v)};
            return {v: v==null?'':String(v)};
          })),
          r.rows.map(row=>row.path?()=>openDrawer(row.path):null)
        )) : el('div',{class:'empty'},'No rows matched.'),
        el('h2',{},'Compiled SQL'),
        el('div',{class:'sqlbox'}, r.sql + '\n\n-- parameters: ' + JSON.stringify(r.params))));
    }catch(e){ box.innerHTML=''; box.append(el('div',{class:'err'},e.message)); }
  }

  async function explain(){
    const box = $('#lensOut'); box.innerHTML='';
    try{
      const r = await api('/api/query/explain',{method:'POST',body:JSON.stringify(buildSpec())});
      box.append(el('div',{class:'panel'},
        el('h2',{style:'margin-top:0'},'Compiled SQL'),
        el('div',{class:'sqlbox'}, r.sql + '\n\n-- parameters: ' + JSON.stringify(r.params)),
        el('h2',{},'Query plan'),
        el('div',{class:'sqlbox'}, r.plan.map(p=>p.detail).join('\n'))));
    }catch(e){ box.append(el('div',{class:'err'},e.message)); }
  }

  async function save(){
    const name = prompt('Name this lens (it becomes a button in the sidebar):');
    if(!name) return;
    try{
      await api('/api/lenses',{method:'POST',body:JSON.stringify({
        name, description:`${B.source} · ${B.conds.length} conditions`,
        spec:buildSpec(), kind:'view', pinned:true})});
      await loadLenses();
      alert('Saved. It is in the sidebar now.');
    }catch(e){ alert('Could not save: '+e.message); }
  }

  async function saveRule(){
    const name = prompt('Name this rule:'); if(!name) return;
    const tag = prompt('Tag to apply to every matching file:'); if(!tag) return;
    try{
      await api('/api/lenses',{method:'POST',body:JSON.stringify({
        name, description:'tagging rule', spec:buildSpec(), kind:'rule', tag})});
      const r = await api('/api/rules/apply',{method:'POST',body:'{}'});
      await loadLenses();
      alert('Rule saved and applied:\n'+JSON.stringify(r.applied,null,1));
    }catch(e){ alert('Could not save: '+e.message); }
  }

  render();
}

const OPS = {
  eq:{}, ne:{}, gt:{}, gte:{}, lt:{}, lte:{},
  contains:{hint:'substring'}, not_contains:{hint:'substring'},
  starts_with:{hint:'prefix'}, ends_with:{hint:'suffix'},
  in:{list:true,hint:'a, b, c'}, not_in:{list:true,hint:'a, b, c'},
  is_null:{nullary:true}, not_null:{nullary:true},
  is_true:{nullary:true}, is_false:{nullary:true},
};

function downloadCSV(r){
  const esc = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const csv = [r.columns.join(',')]
    .concat(r.rows.map(row=>r.columns.map(c=>esc(row[c])).join(','))).join('\n');
  const b = new Blob([csv],{type:'text/csv'});
  const a = el('a',{href:URL.createObjectURL(b),download:'lens.csv'});
  document.body.append(a); a.click(); a.remove();
}

async function runSavedLens(name, root){
  root.append(el('h1',{},name), el('div',{class:'sub'},'Saved lens'));
  const out = el('div',{}); root.append(out);
  out.append(el('div',{class:'empty'},'Running…'));
  try{
    const r = await api(`/api/lenses/${encodeURIComponent(name)}/run`,{method:'POST'});
    out.innerHTML='';
    out.append(el('div',{class:'panel'},
      el('div',{class:'row',style:'justify-content:space-between;margin-bottom:11px'},
        el('h2',{style:'margin:0'},`${r.row_count} rows`),
        el('div',{class:'row'},
          el('button',{class:'btn',onclick:()=>downloadCSV(r)},'Export CSV'),
          el('button',{class:'btn danger',onclick:async()=>{
            if(!confirm(`Delete lens "${name}"?`))return;
            await api('/api/lenses/'+encodeURIComponent(name),{method:'DELETE'});
            await loadLenses(); go('overview');
          }},'Delete'))),
      r.rows.length ? el('div',{class:'scroll',style:'max-height:600px'}, table(
        r.columns,
        r.rows.map(row=>r.columns.map(c=>{
          const v=row[c];
          if(/bytes|size/.test(c)&&typeof v==='number')return{c:'num',v:bytes(v)};
          if(typeof v==='number')return{c:'num',v:num(v)};
          if(/path/.test(c))return{c:'path',v:short(v)};
          return {v:v==null?'':String(v)};
        })),
        r.rows.map(row=>row.path?()=>openDrawer(row.path):null)
      )) : el('div',{class:'empty'},'No rows matched.'),
      el('div',{class:'sqlbox',style:'margin-top:11px'}, r.sql)));
  }catch(e){ out.innerHTML=''; out.append(el('div',{class:'err'},e.message)); }
}

/* ===================== helpers ===================== */
function table(headers, rows, handlers){
  const t = el('table',{},
    el('thead',{}, el('tr',{}, headers.map(h=>el('th',{},h)))),
    el('tbody',{}, rows.map((cells,i)=>{
      const tr = el('tr',{}, cells.map(c=>{
        const td = el('td',{class:c.c||''});
        if(c.v && c.v.nodeType) td.append(c.v); else td.textContent = c.v ?? '';
        return td;
      }));
      const h = handlers && handlers[i];
      if(h) tr.addEventListener('click', h); else tr.style.cursor='default';
      return tr;
    })));
  return t;
}
function chip(v){
  if(!v) return '';
  return el('span',{class:'chip '+String(v).replace(/[^a-z]/gi,'')}, String(v));
}
function field(label, control){
  return el('div',{}, el('label',{class:'fl'},label), control);
}
function select(options, value, onchange){
  const s = el('select',{onchange:e=>onchange(e.target.value)});
  for(const o of options){
    const [v,l] = Array.isArray(o) ? o : [o, o||'— any —'];
    s.append(el('option',{value:v, selected:String(v)===String(value)?'':null}, l));
  }
  s.value = value;
  return s;
}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}

/* ===================== router ===================== */
const VIEWS = {overview:viewOverview, investigator:viewInvestigator, cleanup:viewCleanup,
               projects:viewProjects, ajalugu:viewAjalugu, builder:viewBuilder};

async function go(name, lensName){
  document.querySelectorAll('nav button').forEach(b=>
    b.classList.toggle('on', b.dataset.view===name && b.dataset.lens===lensName));
  const root = $('#view'); root.innerHTML='';
  $('#drawer').classList.remove('open');
  try{
    if(lensName) await runSavedLens(lensName, root);
    else await (VIEWS[name]||viewOverview)(root);
  }catch(e){
    root.innerHTML='';
    root.append(el('h1',{},'Something went wrong'), el('div',{class:'err'},e.message),
      el('div',{class:'sub',style:'margin-top:11px'},
        'If the database is missing, run scripts/scan.py first. If a view is missing, apply sql/10_views.sql.'));
  }
}

async function loadLenses(){
  const list = $('#lensList'); list.innerHTML='';
  try{
    const {lenses} = await api('/api/lenses');
    $('#lensHead').classList.toggle('hide', !lenses.length);
    for(const l of lenses){
      list.append(el('button',{class:'lensbtn','data-view':'lens','data-lens':l.name,
        title:l.description||'', onclick:()=>go('lens', l.name)}, l.name));
    }
  }catch(e){ $('#lensHead').classList.add('hide'); }
}

document.querySelectorAll('nav button[data-view]').forEach(b=>
  b.addEventListener('click', ()=>go(b.dataset.view)));
$('#themeToggle').addEventListener('click', ()=>{
  const next = document.documentElement.dataset.theme==='dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem('fi-theme', next); }catch(e){}
});
try{
  const saved = localStorage.getItem('fi-theme');
  if(saved) document.documentElement.dataset.theme = saved;
}catch(e){}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') $('#drawer').classList.remove('open'); });

loadLenses();
go('overview');
